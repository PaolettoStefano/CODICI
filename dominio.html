<div class="card">

    <div class="header">

        <div class="icon">
            🌐
        </div>

        <h1>Gestione dominio</h1>

        <div class="subtitle">
            Modifica le impostazioni del dominio
        </div>

    </div>


    <div id="status" class="status"></div>


    <!-- DOMINIO -->

    <div class="field">

        <label for="dominio">
            Dominio
        </label>

        <input
            type="text"
            id="dominio"
            placeholder="esempio.it"
            autocomplete="off"
        >

    </div>


    <!-- DATA E ORA -->

    <div class="row">

        <div class="field">

            <label for="data">
                Data
            </label>

            <input
                type="text"
                id="data"
                class="readonly"
                readonly
            >

        </div>


        <div class="field">

            <label for="ora">
                Ora
            </label>

            <input
                type="text"
                id="ora"
                class="readonly"
                readonly
            >

        </div>

    </div>


    <!-- PULSANTI -->

    <div class="buttons">

        <button
            class="back"
            onclick="tornaIndex()"
        >
            ← Torna al sito
        </button>

        <button
            class="save"
            id="saveButton"
            onclick="salva()"
        >
            Salva
        </button>

    </div>


    <div class="footer">
        Ultima lettura da GitHub: <span id="lettura">—</span>
    </div>

</div>


<script>

/* =========================================================
   CONFIGURAZIONE GITHUB
   ========================================================= */

const GITHUB_OWNER = "TUO_USERNAME";

const GITHUB_REPO = "TUO_REPOSITORY";

const GITHUB_BRANCH = "main";

const GITHUB_TOKEN = "INCOLLA_QUI_IL_TUO_TOKEN";


/* =========================================================
   FILE
   ========================================================= */

const FILE_PATH = "dominio.json";

const API_URL =
    `https://api.github.com/repos/` +
    `${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`;


/* SHA necessario per aggiornare il file */

let fileSHA = null;


/* =========================================================
   ELEMENTI
   ========================================================= */

const dominioInput =
    document.getElementById("dominio");

const dataInput =
    document.getElementById("data");

const oraInput =
    document.getElementById("ora");

const statusBox =
    document.getElementById("status");

const saveButton =
    document.getElementById("saveButton");


/* =========================================================
   OROLOGIO
   ========================================================= */

function aggiornaDataOra() {

    const now = new Date();

    dataInput.value =
        now.toLocaleDateString("it-IT", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });

    oraInput.value =
        now.toLocaleTimeString("it-IT", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });
}


/* Aggiorna immediatamente */

aggiornaDataOra();


/* Aggiorna ogni secondo */

setInterval(
    aggiornaDataOra,
    1000
);


/* =========================================================
   STATUS
   ========================================================= */

function mostraStatus(tipo, testo) {

    statusBox.className = "status " + tipo;

    statusBox.textContent = testo;
}


/* =========================================================
   HEADER GITHUB
   ========================================================= */

function headersGitHub() {

    return {

        "Accept":
            "application/vnd.github+json",

        "Authorization":
            `Bearer ${GITHUB_TOKEN}`,

        "X-GitHub-Api-Version":
            "2022-11-28"
    };
}


/* =========================================================
   CARICAMENTO JSON
   ========================================================= */

async function carica() {

    if (
        !GITHUB_TOKEN ||
        GITHUB_TOKEN === "INCOLLA_QUI_IL_TUO_TOKEN"
    ) {

        mostraStatus(
            "error",
            "Token GitHub non configurato."
        );

        return;
    }


    mostraStatus(
        "loading",
        "Caricamento configurazione..."
    );


    try {

        const response = await fetch(
            `${API_URL}?ref=${encodeURIComponent(GITHUB_BRANCH)}`,
            {
                method: "GET",

                headers: headersGitHub()
            }
        );


        if (!response.ok) {

            await erroreGitHub(response);

            return;
        }


        const data =
            await response.json();


        /*
         * Salviamo lo SHA
         */

        fileSHA = data.sha;


        /*
         * Decodifica Base64
         */

        const testo =
            decodeBase64(data.content);


        /*
         * Convertiamo in JSON
         */

        const json =
            JSON.parse(testo);


        /*
         * Prendiamo SOLO il campo dominio
         */

        dominioInput.value =
            json.dominio || "";


        /*
         * Data/ora ultima lettura
         */

        document.getElementById("lettura")
            .textContent =
            new Date().toLocaleString("it-IT");


        statusBox.className =
            "status";


    } catch (error) {

        console.error(error);

        mostraStatus(
            "error",
            "Errore nel caricamento del file."
        );
    }
}


/* =========================================================
   SALVATAGGIO
   ========================================================= */

async function salva() {

    const dominio =
        dominioInput.value.trim();


    /*
     * Controllo dominio vuoto
     */

    if (!dominio) {

        mostraStatus(
            "error",
            "Inserisci un dominio."
        );

        dominioInput.focus();

        return;
    }


    /*
     * Controllo SHA
     */

    if (!fileSHA) {

        mostraStatus(
            "error",
            "Impossibile salvare: il file non è stato caricato."
        );

        return;
    }


    /*
     * Disabilita pulsante
     */

    saveButton.disabled = true;

    saveButton.textContent =
        "Salvataggio...";


    mostraStatus(
        "loading",
        "Salvataggio su GitHub..."
    );


    try {

        /*
         * Creiamo il JSON.
         *
         * Se in futuro aggiungerai altri campi,
         * qui possiamo conservarli.
         */

        const nuovoJSON = {

            dominio: dominio

        };


        const contenuto =
            JSON.stringify(
                nuovoJSON,
                null,
                2
            ) + "\n";


        /*
         * Base64
         */

        const encoded =
            encodeBase64(contenuto);


        /*
         * PUT GitHub
         */

        const response = await fetch(
            API_URL,
            {

                method: "PUT",

                headers: {

                    ...headersGitHub(),

                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message:
                        `Aggiornamento dominio.json - ${dominio}`,

                    content:
                        encoded,

                    sha:
                        fileSHA,

                    branch:
                        GITHUB_BRANCH

                })
            }
        );


        if (!response.ok) {

            await erroreGitHub(response);

            return;
        }


        const result =
            await response.json();


        /*
         * Aggiorniamo SHA
         */

        if (
            result.content &&
            result.content.sha
        ) {

            fileSHA =
                result.content.sha;
        }


        mostraStatus(
            "success",
            "✓ Dominio salvato correttamente."
        );


    } catch (error) {

        console.error(error);

        mostraStatus(
            "error",
            "Errore durante il salvataggio."
        );

    } finally {

        saveButton.disabled = false;

        saveButton.textContent =
            "Salva";
    }
}


/* =========================================================
   TORNA A INDEX
   ========================================================= */

function tornaIndex() {

    window.location.href =
        "index.html";
}


/* =========================================================
   GESTIONE ERRORI GITHUB
   ========================================================= */

async function erroreGitHub(response) {

    let messaggio =
        `Errore GitHub HTTP ${response.status}`;


    try {

        const data =
            await response.json();

        if (data.message) {

            messaggio +=
                "\n\n" + data.message;
        }

    } catch (e) {
        // nessun dettaglio
    }


    if (response.status === 403) {

        messaggio +=
            "\n\nControlla il Personal Access Token:" +
            "\n• repository corretto" +
            "\n• Contents → Read and write";
    }


    if (response.status === 404) {

        messaggio +=
            "\n\nControlla owner, repository, branch e file.";
    }


    if (response.status === 409) {

        messaggio +=
            "\n\nIl file è stato modificato. " +
            "Ricarica la pagina e riprova.";
    }


    mostraStatus(
        "error",
        messaggio
    );
}


/* =========================================================
   BASE64 UTF-8
   ========================================================= */

function decodeBase64(base64) {

    const binary =
        atob(
            base64.replace(/\n/g, "")
        );

    const bytes =
        Uint8Array.from(
            binary,
            c => c.charCodeAt(0)
        );

    return new TextDecoder(
        "utf-8"
    ).decode(bytes);
}


function encodeBase64(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        binary += String.fromCharCode(
            ...bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            )
        );
    }


    return btoa(binary);
}


/* =========================================================
   AVVIO
   ========================================================= */

carica();

</script>

</body>
</html>
