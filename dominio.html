<header>

<div class="container">

<!-- ==================================================

                onclick="salvaConfigurazione()"
            >

            </button>

<!-- ==================================================
     GESTIONE DOMINIO
     ================================================== -->

<div class="card">


    <h2>

        🌐 Dominio

    </h2>


    <div class="sottotitolo">

        Modifica il dominio del sito.

    </div>


    <!-- DOMINIO MODIFICABILE -->

    <div class="campo">


        <label for="dominio">

            Dominio

        </label>


        <input
            type="text"
            id="dominio"
            placeholder="esempio.it"
            autocomplete="off"
        >


    </div>



    <!-- DATA E ORA AUTOMATICHE -->

    <div class="griglia">


        <div class="campo">


            <label for="data">

                Data

            </label>


            <input
                type="text"
                id="data"
                class="automatico"
                readonly
            >

        <div class="campo">


            <label for="ora">

                Ora

            </label>


            <input
                type="text"
                id="ora"
                class="automatico"
                readonly
            >


        </div>


    </div>



    <!-- AZIONI -->

            onclick="tornaIndex()"
        >

            ← Torna al sito

        </button>

            class="success"
            onclick="salvaDominio()"
        >

<script>


/*
==================================================
CONFIGURAZIONE
==================================================
*/


let config =
    JSON.parse(
        localStorage.getItem(
            "gh_dominio_config"
        )
    ) || null;


/*
==================================================
DATI DEL JSON
==================================================
*/


let dominioJSON = {};

let fileSha = "";



/*
==================================================
ELEMENTI
==================================================
*/


const dominioInput =
    document.getElementById(
        "dominio"
    );


const dataInput =
    document.getElementById(
        "data"
    );


const oraInput =
    document.getElementById(
        "ora"
    );


const salvaBtn =
    document.getElementById(
        "salvaBtn"
    );



/*
==================================================
DATA E ORA AUTOMATICHE
==================================================
*/


function aggiornaDataOra() {


    const adesso =
        new Date();


    dataInput.value =
        adesso.toLocaleDateString(
            "it-IT",
            {
                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric"
            }
        );


    oraInput.value =
        adesso.toLocaleTimeString(
            "it-IT",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"
            }
        );

}


aggiornaDataOra();


setInterval(
    aggiornaDataOra,
    1000
);



/*
==================================================
STATO
==================================================
*/


function setStatus(
    messaggio,
    tipo = ""
) {


    const status =
        document.getElementById(
            "status"
        );


    const text =
        document.getElementById(
            "statusText"
        );


    status.className =
        "";


    if (tipo) {

        status.classList.add(
            tipo
        );

    }


    text.innerText =
        messaggio;

}



/*
==================================================
IMPOSTAZIONI
==================================================
*/


function toggleImpostazioni() {


    document
        .getElementById(
            "impostazioni"
        )
        .classList.toggle(
            "aperta"
        );

}



/*
==================================================
SALVA CONFIGURAZIONE
==================================================
*/


function salvaConfigurazione() {


    const token =
        document
            .getElementById(
                "ghToken"
            )
            .value
            .trim();


    const repo =
        document
            .getElementById(
                "ghRepo"
            )
            .value
            .trim();


    if (!token) {

        alert(
            "Inserisci il Personal Access Token."
        );

        return;

    }


    if (
        !repo ||
        !repo.includes("/")
    ) {

        alert(
            "Inserisci il repository nel formato:\nutente/nome-repository"
        );

        return;

    }


    config = {

        token:
            token,

        repo:
            repo

    };


    localStorage.setItem(

        "gh_dominio_config",

        JSON.stringify(
            config
        )

    );


    setStatus(
        "Configurazione salvata",
        "success"
    );


    caricaDominio();

}



/*
==================================================
CARICA DOMINIO.JSON
==================================================
*/


async function caricaDominio() {


    if (!config) {


        setStatus(
            "Configura prima GitHub",
            "error"
        );


        document
            .getElementById(
                "impostazioni"
            )
            .classList.add(
                "aperta"
            );


        return;

    }


    setStatus(
        "Lettura DOMINIO.json...",
        "loading"
    );


    const url =
        `https://api.github.com/repos/` +
        `${config.repo}/contents/DOMINIO.json`;


    try {


        const response =
            await fetch(
                url,
                {

                    method:
                        "GET",

                    headers:
                    {

                        Authorization:
                            `token ${config.token}`,

                        Accept:
                            "application/vnd.github+json"

                    }

                }
            );


        if (
            response.status ===
            404
        ) {


            throw new Error(
                "DOMINIO.json non trovato nel repository."
            );

        }


        if (!response.ok) {


            let messaggio =
                "GitHub ha restituito errore " +
                response.status;


            try {

                const errore =
                    await response.json();


                if (
                    errore.message
                ) {

                    messaggio +=
                        "\n" +
                        errore.message;

                }

            } catch(e) {}


            throw new Error(
                messaggio
            );

        }


        const data =
            await response.json();


        /*
        ==========================================
        SALVIAMO SHA
        ==========================================
        */


        fileSha =
            data.sha;


        /*
        ==========================================
        DECODIFICA
        ==========================================
        */


        const testo =
            decodeBase64UTF8(
                data.content
            );


        /*
        ==========================================
        PARSE JSON
        ==========================================
        */


        dominioJSON =
            JSON.parse(
                testo
            );


        /*
        ==========================================
        MOSTRA SOLO IL CAMPO DOMINIO
        ==========================================
        */


        dominioInput.value =
            dominioJSON.dominio || "";


        setStatus(
            "Dominio caricato correttamente",
            "success"
        );


    } catch(error) {


        console.error(error);


        setStatus(
            "Errore: " +
            error.message,
            "error"
        );


        alert(
            "Errore durante la lettura di DOMINIO.json:\n\n" +
            error.message
        );

    }

}



/*
==================================================
SALVA DOMINIO
==================================================
*/


async function salvaDominio() {


    if (!config) {


        alert(
            "Prima configura GitHub."
        );


        document
            .getElementById(
                "impostazioni"
            )
            .classList.add(
                "aperta"
            );


        return;

    }


    const nuovoDominio =
        dominioInput.value.trim();


    if (!nuovoDominio) {


        alert(
            "Inserisci un dominio."
        );


        dominioInput.focus();


        return;

    }


    if (!fileSha) {


        alert(
            "DOMINIO.json non è stato caricato.\n\n" +
            "Premi prima 'Leggi dominio'."
        );


        return;

    }


    /*
    ==========================================
    DISABILITA PULSANTE
    ==========================================
    */


    salvaBtn.disabled =
        true;


    salvaBtn.innerText =
        "⏳ Salvataggio...";


    setStatus(
        "Salvataggio DOMINIO.json...",
        "loading"
    );


    try {


        /*
        ==========================================
        AGGIORNA SOLO DOMINIO
        ==========================================
        */


        dominioJSON.dominio =
            nuovoDominio;


        /*
        ==========================================
        DATA E ORA
        ==========================================
        */


        /*
         * Se DOMINIO.json contiene già
         * "data" e "ora", vengono aggiornati.
         *
         * Se non esistono, vengono aggiunti.
         *
         * Se NON vuoi salvarli nel JSON,
         * elimina queste due righe.
         */


        dominioJSON.data =
            dataInput.value;


        dominioJSON.ora =
            oraInput.value;



        /*
        ==========================================
        CREA JSON
        ==========================================
        */


        const contenuto =
            JSON.stringify(
                dominioJSON,
                null,
                2
            ) +
            "\n";


        /*
        ==========================================
        CODIFICA BASE64
        ==========================================
        */


        const encoded =
            encodeBase64UTF8(
                contenuto
            );


        /*
        ==========================================
        URL GITHUB
        ==========================================
        */


        const url =
            `https://api.github.com/repos/` +
            `${config.repo}/contents/DOMINIO.json`;


        /*
        ==========================================
        SALVATAGGIO
        ==========================================
        */


        const response =
            await fetch(
                url,
                {

                    method:
                        "PUT",

                    headers:
                    {

                        Authorization:
                            `token ${config.token}`,

                        Accept:
                            "application/vnd.github+json",

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify(
                            {

                                message:
                                    "Aggiornamento DOMINIO.json",

                                content:
                                    encoded,

                                sha:
                                    fileSha

                            }
                        )

                }
            );


        /*
        ==========================================
        CONTROLLO RISPOSTA
        ==========================================
        */


        if (!response.ok) {


            let messaggio =
                "GitHub ha restituito errore " +
                response.status;


            try {

                const errore =
                    await response.json();


                if (
                    errore.message
                ) {

                    messaggio +=
                        "\n\n" +
                        errore.message;

                }

            } catch(e) {}


            throw new Error(
                messaggio
            );

        }


        /*
        ==========================================
        RISPOSTA GITHUB
        ==========================================
        */


        const risultato =
            await response.json();


        /*
        ==========================================
        NUOVO SHA
        ==========================================
        */


        if (
            risultato.content &&
            risultato.content.sha
        ) {

            fileSha =
                risultato.content.sha;

        }


        /*
        ==========================================
        OK
        ==========================================
        */


        setStatus(
            "✓ Dominio salvato correttamente su GitHub",
            "success"
        );


    } catch(error) {


        console.error(error);


        setStatus(
            "Errore durante il salvataggio",
            "error"
        );


        alert(
            "Errore durante il salvataggio:\n\n" +
            error.message
        );


    } finally {


        salvaBtn.disabled =
            false;


        salvaBtn.innerText =
            "💾 Salva";

    }

}



/*
==================================================
DECODIFICA BASE64 UTF-8
==================================================
*/


function decodeBase64UTF8(
    base64
) {


    const binary =
        atob(
            base64.replace(
                /\s/g,
                ""
            )
        );


    const bytes =
        Uint8Array.from(
            binary,
            carattere =>
                carattere.charCodeAt(0)
        );


    return new TextDecoder(
        "utf-8"
    ).decode(
        bytes
    );

}



/*
==================================================
CODIFICA BASE64 UTF-8
==================================================
*/


function encodeBase64UTF8(
    testo
) {


    const bytes =
        new TextEncoder().encode(
            testo
        );


    let binary =
        "";


    const blocco =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += blocco
    ) {


        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    i + blocco
                )
            );

    }


    return btoa(
        binary
    );

}



/*
==================================================
TORNA A INDEX.HTML
==================================================
*/


function tornaIndex() {

    window.location.href =
        "index.html";

}



/*
==================================================
CARICAMENTO AUTOMATICO
==================================================
*/


if (config) {


    /*
    Carica automaticamente
    le impostazioni salvate
    */


    document
        .getElementById(
            "ghToken"
        )
        .value =
        config.token || "";


    document
        .getElementById(
            "ghRepo"
        )
        .value =
        config.repo || "";


    /*
    Carica DOMINIO.json
    */


    caricaDominio();


}
else {


    /*
    Prima configurazione:
    apre automaticamente
    le impostazioni
    */


    document
        .getElementById(
            "impostazioni"
        )
        .classList.add(
            "aperta"
        );


    setStatus(
        "Inserisci le impostazioni GitHub",
        "error"
    );

}


</script>
